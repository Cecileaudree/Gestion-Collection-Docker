services:
  mysql:
    image: mysql:8.0
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
      - private

  backend:
    build: ./app/backend
    env_file: .env
    depends_on:
      - mysql
    networks:
      - app_network
      - private

  frontend:
    build: ./app/frontend
    networks:
      - app_network

  caddy-public:
    image: caddy:2
    volumes:
      - ./caddy-public:/etc/caddy
    depends_on:
      - backend
      - frontend
    networks:
      - app_network
      - public

  caddy-private:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy-private:/etc/caddy
    depends_on:
      - backend
      - frontend
    networks:
      - private
      - app_network

  cloudflared:
    image: cloudflare/cloudflared:2026.1.1
    command: tunnel --url http://caddy-public
    container_name: cloudflared
    depends_on:
      - caddy-public
    user: "1001:1001"
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Paris
    networks:
      - public
      - app_network
    restart: unless-stopped

  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dockge:/app/data
      - ../:/app/stacks
    environment:
      - DOCKGE_STACKS_DIR=/app/stacks
      - DOCKGE_BASE_URL=/dockge
    networks:
      - private

networks:
  app_network:
    name: app_network
    external: true
  public:
    name: public
    external: true
  private:
    name: private
    external: true
  # internet:
  #   name: internet
  #   external: true

volumes:
  mysql_data:
