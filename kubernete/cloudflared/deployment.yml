apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: app
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflared
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.1.1
          args:
            - tunnel
            - --url
            - http://backend:5000
          env:
            - name: PUID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PUID
            - name: PGID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGID
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TZ
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -f http://localhost:7844/ready || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: app
